name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Default to minimum privileges; jobs elevate only what they need.
permissions:
  contents: read

jobs:
  unit:
    name: Lint / Unit coverage / Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # needed for vitest-coverage-report-action PR comment
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild trusted native deps (none expected; safe no-op)
        run: npm rebuild

      - name: Typecheck + lint + format
        run: npm run check

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Report coverage on PR
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@02f3c2e641286b7fa308cd3e430783103ce6103b # v2

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Build
        run: npm run build

  integration:
    name: Integration (Playwright ${{ matrix.playwright }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        playwright: ['1.50.0', '1.60.0']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ matrix.playwright }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run integration tests
        env:
          PLAYWRIGHT_VERSION: ${{ matrix.playwright }}
        run: npm run test:integration

  # The Electron integration test needs the `electron` devDependency's
  # binary (its install script is skipped by --ignore-scripts above, so it
  # is fetched by `npm rebuild`) and a display, which xvfb provides. The
  # plain integration legs skip this test; it is gated on HEAL_IT_ELECTRON.
  integration-electron:
    name: Integration (Electron)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Cache the Electron binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Fetch the Electron binary
        run: npm rebuild electron

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-1.60.0

      - name: Install Playwright browsers (their deps include xvfb)
        run: npx playwright install --with-deps chromium

      - name: Run the Electron integration test under a virtual display
        env:
          HEAL_IT_ELECTRON: '1'
        run: xvfb-run -a npm run test:integration -- tests/integration/specs/electron-window-video.test.ts
